  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"606d7e7e-a276-464a-b685-e2ace4ea8a64\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>\n    body{margin:0;background:#ececea;color:#1a1a18;font-family:Helvetica,Arial,sans-serif}\n    a{color:#ff2318} a:hover{color:#b3170f}\n    input,select,textarea{font-family:Helvetica,Arial,sans-serif;color:#1a1a18;font-size:12px}\n    .cell{border:none;background:transparent;padding:3px 8px;width:100%;box-sizing:border-box}\n    select.cell{padding:2px 6px;font-size:11px;color:#4a4a46;-webkit-appearance:none;-moz-appearance:none;appearance:none;background-image:none}\n    .cell:focus{outline:2px solid #ff2318;outline-offset:-2px;background:#fff6f5}\n    ::-webkit-scrollbar{height:12px;width:12px}\n    ::-webkit-scrollbar-thumb{background:#c9c9c4;border-radius:6px}\n    ::-webkit-scrollbar-track{background:#e2e2de}\n    .thin-x-scroll{scrollbar-width:thin}\n    .thin-x-scroll::-webkit-scrollbar{height:6px;width:6px}    .thin-x-scroll::-webkit-scrollbar-thumb{background:#c9c9c4;border-radius:3px}\n    .thin-x-scroll::-webkit-scrollbar-track{background:transparent}\n    @keyframes jdn-spin{to{transform:rotate(360deg)}}\n    @keyframes jdn-spin-rev{to{transform:rotate(-360deg)}}\n    @keyframes jdn-hue{to{filter:hue-rotate(360deg)}}\n    @keyframes jdn-core{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.8)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}\n  <\u002Fstyle>\n  <script type=\"application/json\" id=\"saved-data\">{}<\u002Fscript>\n<\u002Fhelmet>\n<sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:9999;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px\">\n  <div style=\"position:relative;width:260px;height:260px\">\n    <div style=\"position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#e0459a,#7b3ff2,#2f8fe0,#2ee6c8,#2e9e6b,#f5a623,#e34a33,#e0459a);-webkit-mask:repeating-conic-gradient(from 0deg,#000 0deg 6deg,transparent 6deg 8deg),radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));-webkit-mask-composite:source-in;mask:repeating-conic-gradient(from 0deg,#000 0deg 6deg,transparent 6deg 8deg),radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask-composite:intersect;filter:drop-shadow(0 0 6px rgba(120,120,255,0.6));animation:jdn-spin 9s linear infinite\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:26px;border-radius:50%;background:conic-gradient(from 0deg,#2ee6c8,#2e9e6b,#f5a623,#e34a33,#e0459a,#7b3ff2,#2f8fe0,#2ee6c8);-webkit-mask:repeating-conic-gradient(from 0deg,#000 0deg 3deg,transparent 3deg 7deg),radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));-webkit-mask-composite:source-in;mask:repeating-conic-gradient(from 0deg,#000 0deg 3deg,transparent 3deg 7deg),radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask-composite:intersect;filter:drop-shadow(0 0 8px rgba(120,200,255,0.7));animation:jdn-spin 5s linear infinite\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:52px;border-radius:50%;background:conic-gradient(from 0deg,#e0459a,#2f8fe0,#2ee6c8,#f5a623,#e0459a);-webkit-mask:repeating-conic-gradient(from 0deg,#000 0deg 1.2deg,transparent 1.2deg 4deg),radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));-webkit-mask-composite:source-in;mask:repeating-conic-gradient(from 0deg,#000 0deg 1.2deg,transparent 1.2deg 4deg),radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask-composite:intersect;animation:jdn-spin-rev 7s linear infinite\"><\u002Fdiv>\n    <div style=\"position:absolute;top:50%;left:50%;width:70px;height:70px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#eaf6ff 0%,#7fd0ff 35%,rgba(60,120,220,0.35) 60%,transparent 75%);animation:jdn-core 2.4s ease-in-out infinite\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"color:#12203a;font-size:16px;font-weight:700;letter-spacing:0.06em;text-shadow:0 0 6px rgba(255,255,255,0.95),0 0 3px rgba(255,255,255,0.95),0 1px 2px rgba(255,255,255,0.9)\">Mohamad Please Wait<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"min-height:100vh;padding:28px 32px 60px\">\n<div style=\"position:sticky;top:0;z-index:50;background:#ececea;margin:0 -32px 20px;padding:0 32px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #ff2318;padding:12px 0 16px;flex-wrap:wrap;gap:16px\">\n    <div>\n      <img src=\"2c74ff58-4d18-4e5e-8254-8c475ce33c9e\" alt=\"Jan De Nul\" style=\"height:40px;display:block;margin-bottom:14px\">\n      <div style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#ff2318;margin-bottom:8px\">Waterfront Waste Management<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:700;letter-spacing:-0.01em\">{{ stickyTitle }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ toggleDbCollapsed }}\" style=\"font-size:13px;border:1px solid #d6d6d2;background:#fff;padding:9px 16px;border-radius:2px;cursor:pointer;font-weight:600\">{{ dbCollapseLabel }}<\u002Fbutton>\n      <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Search records…\" style=\"font-size:13px;border:1px solid #d6d6d2;background:#fff;padding:9px 12px;border-radius:2px;width:220px\">\n      <button sc-camel-on-click=\"{{ addRow }}\" style=\"font-size:13px;border:none;background:linear-gradient(135deg,#ff5a3c,#e01000);color:#fff;padding:9px 16px;border-radius:2px;cursor:pointer;font-weight:600\">+ Add record<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onSync }}\" title=\"Connect an Excel/CSV file: first click opens a file picker and loads its data; after that, each Sync writes your current entries back into that file\" style=\"font-size:13px;border:none;background:#1a1a18;color:#fff;padding:9px 16px;border-radius:2px;cursor:pointer;font-weight:600\">{{ saveLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exportXlsx }}\" style=\"font-size:13px;border:1px solid #d6d6d2;background:#fff;padding:9px 16px;border-radius:2px;cursor:pointer\">Export Excel<\u002Fbutton>\n      <sc-if value=\"{{ importMsg }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:#2e7d32;font-weight:600\">{{ importMsg }}<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ showStickyStats }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;gap:0;overflow-x:auto;padding:8px 0\">\n    <sc-for list=\"{{ stickyStats }}\" as=\"s\" hint-placeholder-count=\"6\">\n      <div style=\"padding:6px 18px 6px 0;flex-shrink:0\">\n        <div style=\"font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8a86;white-space:nowrap\">{{ s.label }}<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;color:{{ s.color }};white-space:nowrap\">{{ s.value }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ dbCollapsed }}\" hint-placeholder-val=\"{{ false }}\">\n  <div ref=\"{{ sectionRefs.database }}\" data-section-id=\"database\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px\">\n    <div style=\"background:#f4f4f1;border:1px solid #e4e4e0;border-radius:6px;padding:10px 14px\">\n      <div style=\"font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#8a8a86;margin-bottom:4px\">Total Waste Generated<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;color:#1a1a18\">{{ stat.totalWaste }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#f4f4f1;border:1px solid #e4e4e0;border-radius:6px;padding:10px 14px\">\n      <div style=\"font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#8a8a86;margin-bottom:4px\">Total Recycled Waste<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;color:#1a1a18\">{{ stat.recycledWaste }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#f4f4f1;border:1px solid #e4e4e0;border-radius:6px;padding:10px 14px\">\n      <div style=\"font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#8a8a86;margin-bottom:4px\">Recycle Rate<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;color:#1a1a18\">{{ stat.recyclePct }}<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;margin-top:2px;color:#4a4a46\">{{ stat.recycleDelta }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#f4f4f1;border:1px solid #e4e4e0;border-radius:6px;padding:10px 14px\">\n      <div style=\"font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#8a8a86;margin-bottom:4px\">Landfill Rate<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;color:#1a1a18\">{{ stat.landfillPct }}<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;margin-top:2px;color:#4a4a46\">{{ stat.landfillDelta }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#f4f4f1;border:1px solid #e4e4e0;border-radius:6px;padding:10px 14px\">\n      <div style=\"font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#8a8a86;margin-bottom:4px\">Controlled Rate<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;color:#1a1a18\">{{ stat.controlledPct }}<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;margin-top:2px;color:#4a4a46\">{{ stat.controlledDelta }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#f4f4f1;border:1px solid #e4e4e0;border-radius:6px;padding:10px 14px\">\n      <div style=\"font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#8a8a86;margin-bottom:4px\">Top Service Provider<\u002Fdiv>\n onst width = 1080, nodeW = 1.5, gap = 9;\n    const valid = rows.filter(r => this.toTon(r.weight, r.unit) > 0);\n    if (!valid.length) return { nodes: [], links: [], width, height: 90, cols: [] };\n\n    const kindTotals = new Map();\n    valid.forEach(r => { const k = r.group || 'Unspecified'; kindTotals.set(k, (kindTotals.get(k)||0) + this.toTon(r.weight, r.unit)); });\n    const topKinds = new Set(Array.from(kindTotals.entries()).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]));\n    const kindLabel = k => topKinds.has(k) ? k : 'Other';\n\n    const catAt = (r, i) => {\n      if (i===0) return 'All Waste';\n      if (i===1) return r.wasteOriginator || 'Unspecified';\n      if (i===2) return r.hazardClass || 'Unspecified';\n      if (i===3) return r.destination || 'Unspecified';\n      return kindLabel(r.group || 'Unspecified');\n    };\n\n    const levelTotals = [0,1,2,3,4].map(()=> new Map());\n    const linkTotals = [0,1,2,3].map(()=> new Map());\n    const linkPaths = [0,1,2,3].map(()=> new Map());\n    const nodePaths = new Map();\n    const nodePathVal = new Map();\n    const pathIndex = new Map();\n    valid.forEach(r => {\n      const ton = this.toTon(r.weight, r.unit);\n      const cats = [0,1,2,3,4].map(i=>catAt(r,i));\n      const sig = cats.join('\\u2192');\n      if (!pathIndex.has(sig)) pathIndex.set(sig, pathIndex.size);\n      const pid = pathIndex.get(sig);\n      cats.forEach((c,i) => {\n        levelTotals[i].set(c, (levelTotals[i].get(c)||0)+ton);\n        const nk = i+':'+c;\n        if (!nodePaths.has(nk)) nodePaths.set(nk, new Set()); nodePaths.get(nk).add(pid);\n        if (!nodePathVal.has(nk)) nodePathVal.set(nk, new Map());\n        nodePathVal.get(nk).set(pid, (nodePathVal.get(nk).get(pid)||0)+ton);\n      });\n      for (let i=0;i<4;i++) {\n        const key = cats[i]+'\\u2192'+cats[i+1];\n        linkTotals[i].set(key, (linkTotals[i].get(key)||0)+ton);\n        if (!linkPaths[i].has(key)) linkPaths[i].set(key, new Set());\n        lin  (t === 'inlineStr') { const tEl = cEl.querySelector('is'); val = tEl ? tEl.textContent : ''; }\n        else if (t === 's') { const vEl = cEl.querySelector('v'); val = vEl ? (shared[parseInt(vEl.textContent,10)]||'') : ''; }\n        else { const vEl = cEl.querySelector('v'); val = vEl ? vEl.textContent : ''; }\n        cells[ci] = val;\n      });\n      rows.push(cells);\n    });\n    return rows;\n  }\n\n  async importXlsx(buf){\n    const files = await this.unzip(buf);\n    const dec = new TextDecoder();\n    const getText = n => files[n] ? dec.decode(files[n]) : null;\n    const wbXml = getText('xl/workbook.xml');\n    if (!wbXml) throw new Error('workbook.xml missing');\n    const relsXml = getText('xl/_rels/workbook.xml.rels') || '';\n    const relMap = {};\n    const relsDoc = new DOMParser().parseFromString(relsXml, 'application/xml');\n    relsDoc.querySelectorAll('Relationship').forEach(r => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });\n    let shared = [];\n    const ssXml = getText('xl/sharedStrings.xml');\n    if (ssXml) {\n      const ssDoc = new DOMParser().parseFromString(ssXml, 'application/xml');\n      ssDoc.querySelectorAll('si').forEach(si => shared.push(si.textContent));\n    }\n    const wbDoc = new DOMParser().parseFromString(wbXml, 'application/xml');\n    const sheets = [];\n    wbDoc.querySelectorAll('sheet').forEach(s => {\n      const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');\n      let target = relMap[rid] || '';\n      if (target && !target.startsWith('xl/')) target = 'xl/' + target.replace(/^\\//,'');\n      const xml = getText(target);\n      if (xml) sheets.push({ name: s.getAttribute('name')||'', rows: this.parseSheet(xml, shared) });\n    });\n    return sheets;\n  }\n\n  headerMap(headerRow, columns){\n    const map = {};\n    columns.forEach(c => { map[String(c.label).trim().toLowerCase()] = c.key; });\n    return headerRow.map(h => map[String(h||'').trim().toLowerCase()] || null);\n  }\n\n  looksLikeManpower(headerRow){\n    const hs = headerRow.map(h=>String(h||'').trim().toLowerCase());\n    return hs.includes('month') && hs.includes('category');\n  }\n\n  normalizeImportedDate(v){\n    if (v === '' || v == null) return '';\n    if (!isNaN(v) && Number(v) > 20000 && Number(v) < 80000) return this.excelSerialToDate(Number(v));\n    return this.normalizeDate(String(v));\n  }\n\n  importWasteRows(dataRows, keys){\n    const newRows = dataRows.map(cols => {\n      const r = { _id: Math.random().toString(36).slice(2) };\n      COLUMNS.forEach(c => { if(!c.computed) r[c.key] = ''; });\n      keys.forEach((key, i) => { if (key && cols[i] !== undefined && key !== 'convertedTon' && key !== 'lossGain') r[key] = String(cols[i]??''); });\n      if (r.reportingDate) r.reportingDate = this.normalizeImportedDate(r.reportingDate);\n      if (r.unit) r.unit = this.normalizeUnit(r.unit);\n      return r;\n    }).filter(r => Object.keys(r).some(k => k !== '_id' && r[k]));\n    return newRows;\n  }\n\n  importManpowerRows(dataRows, keys){\n    return dataRows.map(cols => {\n      const r = { _id: Math.random().toString(36).slice(2) };\n      MANPOWER_COLUMNS.forEach(c => { r[c.key] = ''; });\n      keys.forEach((key, i) => { if (key && cols[i] !== undefined) r[key] = String(cols[i]??''); });\n      if (r.month) r.month = this.normalizeImportedDate(r.month);\n      return r;\n    }).filter(r => Object.keys(r).some(k => k !== '_id' && r[k]));\n  }\n\n  mergeImportedOptions(newRows){\n    this.setState(s => {\n      const optionGroups = s.optionGroups.map(g => ({ ...g, subs: g.subs.map(sub => ({ ...sub, items: [...sub.items] })) }));\n      const byTitle = {};\n      optionGroups.forEach(g => { byTitle[g.title] = g; });\n      COLUMNS.forEach(c => {\n        if (!c.optList) return;\n        const g = byTitle[c.optList];\n        if (!g) return;\n        const known = new Set(g.subs.reduce((a,sub)=>a.concat(sub.items),[]));\n        newRows.forEach(r => {\n          const v = (r[c.key]||'').trim();\n          if (v && !known.has(v)) { g.subs[0].items.push(v); known.add(v); }\n        });\n      });\n      this.persistOpts(optionGroups);\n      return { optionGroups };\n    });\n  }\n\n  exportCsv(){\n    const cols = COLUMNS;\n    const esc = v => '\"'+String(v==null?'':v).replace(/\"/g,'\"\"')+'\"';\n    const header = cols.map(c=>esc(c.label)).join(',');\n    const lines = this.state.rows.map(r => cols.map(c=>{\n      if(c.key==='convertedTon') return esc(this.toTon(r.weight,r.unit));\n      if(c.key==='lossGain') return esc(this.num(r.gain)-this.num(r.expense));\n      if(c.key==='reportingDate') return esc(this.toDisplayDate(r.reportingDate));\n      return esc(r[c.key]);\n    }).join(','));\n    const csv = [header, ...lines].join('\\r\\n');\n    const blob = new Blob([csv], {type:'text/csv'});\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'waste-register.csv';\n    a.click();\n    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
